<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KMS Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5;font-family:Arial,sans-serif}.login-card{width:380px;background:#fff;padding:40px;border-radius:20px;box-shadow:0 10px 35px rgba(0,0,0,.08)}.logo{width:55px;height:55px;background:#111;color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:25px}h1{margin:0 0 8px;font-size:28px}.subtitle{color:#777;margin-bottom:30px}label{display:block;margin-bottom:8px;font-weight:600}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;margin-bottom:18px;font-size:15px;outline:none}input:focus{border-color:#111}button{width:100%;padding:14px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;font-weight:600;cursor:pointer}button:hover{background:#333}.error{background:#ffe8e8;color:#c62828;padding:12px;border-radius:10px;margin-bottom:18px;font-size:14px}.home{display:block;text-align:center;margin-top:18px;color:#666;text-decoration:none;font-size:14px}
</style></head><body class="login-page"><button class="theme-toggle" type="button" id="themeToggle" aria-label="Toggle dark mode">☾ Dark</button><div class="login-card"><div class="logo">KMS</div><h1>Admin Login</h1><div class="subtitle">Login to access KMS recruitment applications.</div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST"><label>Username</label><input type="text" name="username" placeholder="Enter username" required autocomplete="username"><label>Password</label><input type="password" name="password" placeholder="Enter password" required autocomplete="current-password"><button type="submit">Login</button></form><a class="home" href="/">← Recruitment page</a></div><script>
(function(){const b=document.getElementById("themeToggle");const dark=localStorage.getItem("kms-theme")==="dark";if(dark)document.body.classList.add("dark-mode");function update(){const on=document.body.classList.toggle("dark-mode");localStorage.setItem("kms-theme",on?"dark":"light");b.textContent=on?"☀ Light":"☾ Dark"} b.textContent=dark?"☀ Light":"☾ Dark";b.addEventListener("click",update)})();
</script></body></html>
